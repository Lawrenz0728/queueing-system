<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Staff Login | 1PNX Piloting Services</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--cyan:#19d9ff;--blue:#168cff;--deep:#06172e;--card:rgba(4,22,42,.88);--text:#f4fbff;--muted:#91abc2;--danger:#ff7185}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--text)}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px;overflow-x:hidden;background:radial-gradient(circle at 15% 25%,#0b5d8c55,transparent 30%),radial-gradient(circle at 85% 75%,#008dff44,transparent 32%),linear-gradient(135deg,#031227,#06315b 48%,#020a18)}
body:before,body:after{content:"";position:fixed;inset:auto;pointer-events:none;opacity:.22}
body:before{width:420px;height:420px;left:-120px;top:8%;border:2px solid #0bbfff44;border-radius:50%;box-shadow:0 0 80px #0bbfff22}
body:after{width:600px;height:2px;right:-100px;bottom:18%;background:linear-gradient(90deg,transparent,var(--cyan),transparent);transform:rotate(-28deg);box-shadow:0 0 30px var(--cyan)}
.brand{position:fixed;top:28px;left:34px;display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:1px}.wing{font-size:34px;filter:drop-shadow(0 0 8px #19d9ff88)}.brand small{display:block;color:#7ca0bd;font-size:10px;letter-spacing:2px;margin-top:2px}
.card{width:min(470px,100%);background:var(--card);border:1px solid #17cfff;border-radius:28px;padding:36px 38px;box-shadow:0 0 0 1px #0c6c9b55 inset,0 25px 80px #0009,0 0 45px #00cfff20;backdrop-filter:blur(16px)}
.logo{width:78px;height:78px;margin:0 auto 18px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(145deg,#0d8dff,#063e9c);border:1px solid #2ae4ff;box-shadow:0 0 28px #00cfff44;font-size:42px}
h1{text-align:center;margin:0;font-size:30px;letter-spacing:.5px}h1 span{color:var(--cyan)}.sub{text-align:center;color:var(--muted);font-size:13px;margin:8px 0 28px}
.divider{height:1px;background:linear-gradient(90deg,transparent,#18cfff,transparent);margin:0 0 24px}
label{display:block;font-size:13px;font-weight:700;margin:16px 0 8px;color:#eaf8ff}input{width:100%;height:50px;padding:0 15px;border-radius:12px;border:1px solid #2e6f99;background:#071d35;color:#fff;outline:none;font-size:15px;box-shadow:inset 0 0 18px #0004}input::placeholder{color:#6f8da5}input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px #18cfff22,inset 0 0 18px #0004}
button{width:100%;height:52px;margin-top:25px;border:0;border-radius:13px;color:#fff;font-weight:800;font-size:14px;letter-spacing:.4px;cursor:pointer;background:linear-gradient(90deg,#087cff,#12d9c9);box-shadow:0 8px 25px #079fff44}button:hover{filter:brightness(1.08)}button:disabled{opacity:.6;cursor:not-allowed}
#message{display:none;margin-top:15px;padding:12px 14px;border-radius:10px;font-size:13px;line-height:1.4;background:#3a1320;border:1px solid #ff5e77;color:#ffb4bf}#message.success{background:#07392f;border-color:#1be0bd;color:#a8ffed}
.links{text-align:center;margin-top:20px;color:#a4bbcd;font-size:13px}.links a{color:#20d9ff;text-decoration:none;font-weight:800}.links a:hover{text-decoration:underline}.footer{text-align:center;margin-top:25px;color:#66849d;font-size:10px;letter-spacing:2px}.back{position:fixed;bottom:24px;left:34px;color:#7395ad;font-size:12px}.back a{color:#20cfff;text-decoration:none}
@media(max-width:600px){.brand{position:static;justify-content:center;margin-bottom:18px}.back{position:static;text-align:center;margin-top:18px}.card{padding:30px 24px}.logo{width:70px;height:70px}h1{font-size:25px}body{display:flex;flex-direction:column}}
</style>
</head>
<body>
<div class="brand"><div class="wing">✦</div><div>1PNX<small>PILOTING SERVICES</small></div></div>
<div class="card">
  <div class="logo">🔐</div>
  <h1>STAFF <span>LOGIN</span></h1>
  <div class="sub">Members Services Queueing System</div>
  <div class="divider"></div>
  <form id="loginForm">
    <label for="username">Username</label>
    <input id="username" type="text" placeholder="Enter your username" required autocomplete="username" maxlength="50">
    <label for="password">Password</label>
    <input id="password" type="password" placeholder="Enter your password" required autocomplete="current-password">
    <button id="loginBtn" type="submit">SIGN IN</button>
    <div id="message" role="alert"></div>
  </form>
  <div class="links">New staff? <a href="staff_registration.html">Register here →</a></div>
  <div class="footer">STAFF ACCESS ONLY</div>
</div>
<div class="back"><a href="index.html">← Back to Home</a></div>
<script>
const SUPABASE_URL='https://szjvzbsmkowpqezrvbqo.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_fYCD8HfyfJPWwjZ8HiC8QA_G2TKqStx';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
function authEmail(username){return username.trim().toLowerCase().replace(/[^a-z0-9._-]/g,'')+'@staff.1pnx.local';}
const form=document.getElementById('loginForm'),msg=document.getElementById('message'),btn=document.getElementById('loginBtn');
function show(t,ok=false){msg.textContent=t;msg.className=ok?'success':'';msg.style.display='block'}
(async()=>{const {data}=await db.auth.getSession();if(data.session) location.replace('staff_queue_dashboard.html')})();
form.addEventListener('submit',async e=>{e.preventDefault();msg.style.display='none';btn.disabled=true;btn.textContent='SIGNING IN...';
 const username=document.getElementById('username').value.trim(); const password=document.getElementById('password').value;
 if(!username){show('Please enter your username.');btn.disabled=false;btn.textContent='SIGN IN';return}
 const {error}=await db.auth.signInWithPassword({email:authEmail(username),password});
 if(error){show('Login failed: Invalid username or password.');btn.disabled=false;btn.textContent='SIGN IN';return}
 location.replace('staff_queue_dashboard.html');
});
</script>
</body>
</html>
