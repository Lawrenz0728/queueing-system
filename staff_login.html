<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Staff Login | Members Services Queueing System</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Arial,sans-serif;background:linear-gradient(120deg,#08b9ec,#0754b9 48%,#061b55);padding:20px}
.card{width:min(430px,100%);background:#fff;border:3px solid #13d9ff;border-radius:22px;padding:32px;box-shadow:0 15px 45px #001a5555;color:#14264b}
.logo{width:76px;height:76px;margin:0 auto 15px;display:grid;place-items:center;border-radius:18px;background:#0754b9;color:#fff;font-size:40px;border:2px solid #13d9ff}
h1{text-align:center;color:#0754b9;font-size:25px;margin:0 0 8px}.sub{text-align:center;color:#60708b;font-size:13px;margin-bottom:25px}
label{display:block;font-weight:700;font-size:13px;margin:15px 0 7px}input{width:100%;padding:13px;border:1px solid #8cb8db;border-radius:9px;font-size:15px}button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:9px;background:#0754b9;color:#fff;font-weight:700;font-size:15px;cursor:pointer}button:hover{filter:brightness(1.1)}button:disabled{opacity:.65;cursor:not-allowed}
#message{display:none;margin-top:15px;padding:11px;border-radius:8px;background:#ffe0e7;color:#9b1639;font-size:13px;line-height:1.4}#message.success{background:#def8e7;color:#176b3a}
#resendBtn{display:none;background:#0b8fbd;margin-top:10px;font-size:13px;padding:11px}
.links{text-align:center;margin-top:18px;font-size:13px}.links a{color:#0754b9;font-weight:700;text-decoration:none}.links a:hover{text-decoration:underline}.footer{text-align:center;color:#71809a;font-size:11px;margin-top:20px}
</style>
</head>
<body>
<div class="card">
<div class="logo">🔐</div>
<h1>STAFF LOGIN</h1>
<div class="sub">Members Services Queueing System</div>
<form id="loginForm">
<label for="email">Staff Email</label>
<input id="email" type="email" placeholder="staff@example.com" required autocomplete="username">
<label for="password">Password</label>
<input id="password" type="password" placeholder="Enter your password" required autocomplete="current-password">
<button id="loginBtn" type="submit">SIGN IN</button>
<div id="message" role="alert"></div>

</form>
<div class="links">New staff? <a href="staff_registration.html">Register here</a></div>
<div class="footer">Authorized staff only</div>
</div>
<script>
const SUPABASE_URL='https://szjvzbsmkowpqezrvbqo.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_fYCD8HfyfJPWwjZ8HiC8QA_G2TKqStx';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const msg=document.getElementById('message');
const loginBtn=document.getElementById('loginBtn');
const emailInput=document.getElementById('email');
const passwordInput=document.getElementById('password');

function show(text,success=false){
  msg.textContent=text;
  msg.className=success?'success':'';
  msg.style.display='block';
}

(async()=>{
  const {data:{session}}=await db.auth.getSession();
  if(session) location.replace('staff_queue_dashboard.html');
})();

document.getElementById('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  msg.style.display='none';
  loginBtn.disabled=true;
  loginBtn.textContent='SIGNING IN...';

  const email=emailInput.value.trim();
  const password=passwordInput.value;
  const {error}=await db.auth.signInWithPassword({email,password});

  if(error){
    show('Login failed: '+error.message);
    loginBtn.disabled=false;
    loginBtn.textContent='SIGN IN';
    return;
  }
  location.replace('staff_queue_dashboard.html');
});
</script>
</body>
</html>
