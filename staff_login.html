<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff Login | 1PNX Piloting Services</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--c:#19d9ff;--card:#04182be8;--muted:#8eaac1;--danger:#ff6f86;--ok:#20e0bb}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:#f5fbff;display:flex;align-items:center;justify-content:center;padding:28px;background:radial-gradient(circle at 12% 25%,#0b6b9b55,transparent 28%),radial-gradient(circle at 88% 70%,#007bff44,transparent 32%),linear-gradient(135deg,#020c1b,#07345e 50%,#020817)}.brand{position:fixed;top:25px;left:32px;font-weight:900;letter-spacing:1px}.brand small{display:block;color:#7da1ba;font-size:9px;letter-spacing:2px;margin-top:3px}.brand .wing{color:var(--c);font-size:28px;display:inline-block;margin-right:7px}.card{width:min(440px,100%);background:var(--card);border:1px solid var(--c);border-radius:27px;padding:34px 35px;box-shadow:0 0 0 1px #0b79a855 inset,0 25px 70px #000b,0 0 38px #00d9ff22;backdrop-filter:blur(14px)}.logo{width:70px;height:70px;margin:0 auto 15px;border-radius:19px;display:grid;place-items:center;background:linear-gradient(145deg,#0b8eff,#073e9d);border:1px solid #2ae5ff;box-shadow:0 0 25px #00d9ff55;font-size:37px}h1{text-align:center;margin:0;font-size:29px}h1 span{color:var(--c)}.sub{text-align:center;color:var(--muted);font-size:12px;margin:8px 0 23px}.divider{height:1px;background:linear-gradient(90deg,transparent,var(--c),transparent);margin-bottom:20px}label{display:block;font-size:12px;font-weight:800;margin:15px 0 6px}input{width:100%;height:49px;padding:0 14px;border-radius:11px;border:1px solid #2f709b;background:#071d34;color:#fff;outline:0;font-size:14px}input:focus{border-color:var(--c);box-shadow:0 0 0 3px #19d9ff20}button{width:100%;height:51px;margin-top:23px;border:0;border-radius:12px;color:#fff;font-weight:900;font-size:13px;cursor:pointer;background:linear-gradient(90deg,#087cff,#12d9c9);box-shadow:0 8px 25px #079fff40}button:disabled{opacity:.55;cursor:not-allowed}#message{display:none;margin-top:13px;padding:11px 13px;border-radius:9px;font-size:12px;line-height:1.4;background:#3b1220;border:1px solid var(--danger);color:#ffb7c1}#message.ok{background:#07392f;border-color:var(--ok);color:#a7ffed}.links{text-align:center;margin-top:19px;font-size:12px;color:#a6bdcf}.links a{color:var(--c);font-weight:800;text-decoration:none}.footer{text-align:center;margin-top:21px;color:#607f98;font-size:9px;letter-spacing:2px}.back{position:fixed;bottom:22px;left:32px;font-size:11px}.back a{color:#6eb4d5;text-decoration:none}@media(max-width:600px){body{padding:18px}.brand{position:static;margin-bottom:15px}.card{padding:29px 22px}.back{position:static;margin-top:15px;text-align:center}h1{font-size:25px}}
</style></head><body><div class="brand"><span class="wing">✦</span>1PNX<small>PILOTING SERVICES</small></div><div class="card"><div class="logo">🔐</div><h1>STAFF <span>LOGIN</span></h1><div class="sub">Members Services Queueing System</div><div class="divider"></div><form id="f"><label>Username</label><input id="u" required maxlength="50" autocomplete="username" placeholder="Enter your username"><label>Password</label><input id="p" type="password" required autocomplete="current-password" placeholder="Enter your password"><button id="b">SIGN IN</button><div id="message"></div></form><div class="links">New staff? <a href="staff_registration.html">Register here →</a></div><div class="footer">STAFF ACCESS ONLY</div></div><div class="back"><a href="index.html">← Back to Home</a></div><script>
const db=supabase.createClient('https://szjvzbsmkowpqezrvbqo.supabase.co','sb_publishable_fYCD8HfyfJPWwjZ8HiC8QA_G2TKqStx');const key='staff_session_token';const token=localStorage.getItem(key);if(token){db.rpc('verify_staff_session',{p_token:token}).then(({data,error})=>{if(!error&&data?.valid)location.replace('staff_queue_dashboard.html');else localStorage.removeItem(key)})}const f=document.getElementById('f'),b=document.getElementById('b'),m=document.getElementById('message');function show(t,ok=false){m.textContent=t;m.className=ok?'ok':'';m.style.display='block'}f.addEventListener('submit',async e=>{e.preventDefault();m.style.display='none';b.disabled=true;b.textContent='SIGNING IN...';const u=document.getElementById('u').value.trim(),p=document.getElementById('p').value;const {data,error}=await db.rpc('login_staff',{p_username:u,p_password:p});if(error||!data?.success){show(error?.message||'Invalid username or password.');b.disabled=false;b.textContent='SIGN IN';return}localStorage.setItem(key,data.token);location.replace('staff_queue_dashboard.html')});
