<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Staff Registration | Members Services Queueing System</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Arial,sans-serif;background:linear-gradient(120deg,#08b9ec,#0754b9 48%,#061b55);padding:20px}
.card{width:min(430px,100%);background:#fff;border:3px solid #13d9ff;border-radius:22px;padding:32px;box-shadow:0 15px 45px #001a5555;color:#14264b}
.logo{width:76px;height:76px;margin:0 auto 15px;display:grid;place-items:center;border-radius:18px;background:#0754b9;color:#fff;font-size:40px;border:2px solid #13d9ff}
h1{text-align:center;color:#0754b9;font-size:25px;margin:0 0 8px}.sub{text-align:center;color:#60708b;font-size:13px;margin-bottom:25px}
label{display:block;font-weight:700;font-size:13px;margin:15px 0 7px}
input{width:100%;padding:13px;border:1px solid #8cb8db;border-radius:9px;font-size:15px}
button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:9px;background:#0754b9;color:#fff;font-weight:700;font-size:15px;cursor:pointer}
button:hover{filter:brightness(1.1)}button:disabled{opacity:.65;cursor:not-allowed}
#message{display:none;margin-top:15px;padding:11px;border-radius:8px;background:#ffe0e7;color:#9b1639;font-size:13px;line-height:1.4}
#message.success{background:#def8e7;color:#176b3a}
#resendBtn{display:none;background:#0b8fbd;margin-top:10px;font-size:13px;padding:11px}
.links{text-align:center;margin-top:18px;font-size:13px}.links a{color:#0754b9;font-weight:700;text-decoration:none}.links a:hover{text-decoration:underline}
.footer{text-align:center;color:#71809a;font-size:11px;margin-top:20px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">📝</div>
  <h1>STAFF REGISTRATION</h1>
  <div class="sub">Members Services Queueing System</div>

  <form id="registerForm">
    <label for="email">Staff Email</label>
    <input id="email" type="email" placeholder="staff@example.com" required autocomplete="email">

    <label for="password">Password</label>
    <input id="password" type="password" placeholder="Create a password" minlength="6" required autocomplete="new-password">

    <label for="confirmPassword">Confirm Password</label>
    <input id="confirmPassword" type="password" placeholder="Re-enter your password" minlength="6" required autocomplete="new-password">

    <button id="registerBtn" type="submit">CREATE STAFF ACCOUNT</button>
    <div id="message" role="alert"></div>
    <button id="resendBtn" type="button">RESEND CONFIRMATION EMAIL</button>
  </form>

  <div class="links">Already registered? <a href="staff_login.html">Sign in here</a></div>
  <div class="footer">Staff registration</div>
</div>

<script>
const SUPABASE_URL='https://szjvzbsmkowpqezrvbqo.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_fYCD8HfyfJPWwjZ8HiC8QA_G2TKqStx';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const msg=document.getElementById('message');
const btn=document.getElementById('registerBtn');
const resendBtn=document.getElementById('resendBtn');
const REDIRECT_URL=new URL('staff_login.html',window.location.href).href;

function show(text,success=false){
  msg.textContent=text;
  msg.className=success?'success':'';
  msg.style.display='block';
}

document.getElementById('registerForm').addEventListener('submit',async e=>{
  e.preventDefault();
  msg.style.display='none';

  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  const confirmPassword=document.getElementById('confirmPassword').value;

  if(password!==confirmPassword){show('Passwords do not match.');return;}
  if(password.length<6){show('Password must contain at least 6 characters.');return;}

  btn.disabled=true;
  btn.textContent='CREATING ACCOUNT...';

  const {data,error}=await db.auth.signUp({
    email,
    password,
    options:{emailRedirectTo:REDIRECT_URL}
  });

  if(error){
    show('Registration failed: '+error.message);
    btn.disabled=false;
    btn.textContent='CREATE STAFF ACCOUNT';
    return;
  }

  if(data.session){
    show('Registration successful. Redirecting to the staff dashboard...',true);
    setTimeout(()=>location.replace('staff_queue_dashboard.html'),1200);
  }else{
    show('Registration successful. Please check your email to confirm your account, then sign in.',true);
    resendBtn.style.display='block';
    resendBtn.dataset.email=email;
    btn.disabled=false;
    btn.textContent='CREATE STAFF ACCOUNT';
  }
});

resendBtn.addEventListener('click',async()=>{
  const email=resendBtn.dataset.email || document.getElementById('email').value.trim();
  if(!email){show('Please enter your staff email first.');return;}
  resendBtn.disabled=true;
  resendBtn.textContent='SENDING...';
  const {error}=await db.auth.resend({
    type:'signup',
    email,
    options:{emailRedirectTo:REDIRECT_URL}
  });
  if(error){
    show('Could not resend confirmation email: '+error.message);
  }else{
    show('Confirmation email sent. Please check your inbox and spam/junk folder.',true);
  }
  resendBtn.disabled=false;
  resendBtn.textContent='RESEND CONFIRMATION EMAIL';
});

</script>
</body>
</html>
