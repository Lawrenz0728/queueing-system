</style></head><body><div class="brand"><span class="wing">✦</span>1PNX<small>PILOTING SERVICES</small></div><div class="card"><div class="logo">📝</div><h1>STAFF <span>REGISTRATION</span></h1><div class="sub">Create a staff account to access the queueing system</div><div class="divider"></div><form id="f"><label>Username</label><input id="u" required maxlength="50" autocomplete="username" placeholder="Enter your username"><label>Password</label><input id="p" type="password" required minlength="6" autocomplete="new-password" placeholder="Create your password"><label>Confirm Password</label><input id="c" type="password" required minlength="6" autocomplete="new-password" placeholder="Confirm your password"><label>Registration Passcode</label><input id="pc" type="password" required autocomplete="off" placeholder="Enter administrator passcode"><button id="b">CREATE STAFF ACCOUNT</button><div id="message"></div></form><div class="links">Already registered? <a href="staff_login.html">Sign in here →</a></div><div class="footer">STAFF ACCESS ONLY</div></div><div class="back"><a href="index.html">← Back to Home</a></div><script>
const db=supabase.createClient('https://szjvzbsmkowpqezrvbqo.supabase.co','sb_publishable_fYCD8HfyfJPWwjZ8HiC8QA_G2TKqStx');const f=document.getElementById('f'),b=document.getElementById('b'),m=document.getElementById('message');function show(t,ok=false){m.textContent=t;m.className=ok?'ok':'';m.style.display='block'}f.addEventListener('submit',async e=>{e.preventDefault();m.style.display='none';const u=document.getElementById('u').value.trim().toLowerCase(),p=document.getElementById('p').value,c=document.getElementById('c').value,pc=document.getElementById('pc').value;if(!/^[a-z0-9][a-z0-9._-]{2,49}$/.test(u))return show('Username must be 3-50 characters and use only letters, numbers, dot, underscore, or hyphen.');if(p.length<6)return show('Password must contain at least 6 characters.');if(p!==c)return show('Passwords do not match.');if(!pc)return show('Registration passcode is required.');b.disabled=true;b.textContent='CREATING ACCOUNT...';const {data,error}=await db.rpc('register_staff_v3',{p_username:u,p_password:p,p_passcode:pc});if(error){show(error.message||'Unable to create staff account. If you just created the RPC, wait a few seconds and refresh the page.');b.disabled=false;b.textContent='CREATE STAFF ACCOUNT';return}show('Staff account created successfully. Redirecting to login...',true);setTimeout(()=>location.href='staff_login.html',900)});
